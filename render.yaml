services:
  # ==========================================
  # Backend API Web Service
  # ==========================================
  - type: web
    name: quizzy-api
    runtime: node
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false # Set this in Render Dashboard to your MongoDB Atlas connection string
      - key: CLIENT_URL
        sync: false # Set this to your frontend URL (e.g. https://quizzy-web.onrender.com or https://quizzy.vercel.app)
      - key: ENABLE_KEEP_ALIVE
        value: "true"

  # ==========================================
  # Frontend Static Site
  # ==========================================
  - type: web
    name: quizzy-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false # Set this to your deployed backend URL + /api (e.g. https://quizzy-api.onrender.com/api)
